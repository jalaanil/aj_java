<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Form</title>
</head>
<body>

<h2>User Form</h2>

<p> <i>this is form.html page</i></p>

<form th:action="@{/form}"
      th:object="${user}"
      method="post">

    <label>Name</label><br>
    <input type="text" th:field="*{name}" />
    <br><br>

    <label>Email</label><br>
    <input type="email" th:field="*{email}" />
    <br><br>

    <button type="submit">Submit</button>

</form>

</body>
</html>
